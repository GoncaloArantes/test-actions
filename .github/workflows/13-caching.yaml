name: 13 - Using Caching

on:
    workflow_dispatch:
        inputs:
            use-cache:
                type: boolean
                default: true
                description: Whether to execute cache step
            node-version:
                type: choice
                options:
                    - 24.x
                    - 26.x
                default: 24.x
                description: Node version

jobs:
    build:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: 13-caching/react-app
        steps:
          - name: Checkout code
            uses: actions/checkout@v7
          - name: Setup Node
            uses: actions/setup-node@v6
            with:
              node-version: ${{ inputs.node-version }}
          - name: Download cached dependencies
            id: cache
            if: ${{ inputs.use-cache }}
            uses: actions/cache@v6
            with:
              path: 13-caching/react-app/node_modules
              # It's important that the key remains stable as long as the list of dependencies doesn't change
              # Easily achieved by package-lock.json, since it contains all the dependencies.
              key: deps-node-modules-${{ hashFiles('13-caching/react-app/package-lock.json') }}
          - name: Install dependencies
            if: ${{ !steps.cache.outputs.cache-hit }}
            run: npm ci
          - name: Testing
            run: npm run test
          - name: Building
            run: npm run build
          - name: Deploying to nonprod
            run: |
              echo "Deploying to nonprod"